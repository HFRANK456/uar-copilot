name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Tests connect as a non-superuser owner, because superusers bypass row-level security.
      TEST_DATABASE_URL: postgresql://uar_app:app@localhost:5432/uar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Create test database and role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE uar_app LOGIN PASSWORD 'app'"
          psql -h localhost -U postgres -c "CREATE DATABASE uar_test OWNER uar_app"
          psql -h localhost -U postgres -d uar_test -c "ALTER SCHEMA public OWNER TO uar_app"
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/uar-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/uar-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
